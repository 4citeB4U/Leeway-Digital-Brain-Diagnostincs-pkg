# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DIGITAL_BRAIN.CI
# TAG: LEEWAY.DIGITAL_BRAIN.CI_EVIDENCE_CAPTURE_V2
# WHO: LeeWay package maintainers and GitHub Actions
# WHAT: Test source and capture uploadable, hash-bound evidence on every run.
# WHEN: Pull requests and pushes to the owning branches.
# WHERE: .github/workflows/source-qualification.yml
# WHY: Preserve pass and failure evidence instead of orphaned test outputs.
# HOW: One Node runner per OS, bounded evidence JSON + hash, always-upload, read-only artifact-index readback.
# LICENSE: MIT (package CI, not receipt or Veritas authority).
name: Source qualification
on:
  pull_request:
  push:
    branches: [main, feat/diagnostics-first-permission-gates]
permissions:
  contents: read
jobs:
  source-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source tests and capture sanitized diagnostics evidence
        run: node scripts/capture-source-evidence.mjs
      - name: Upload source evidence candidate even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leeway-source-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  evidence-index:
    needs: source-test
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Read back artifact metadata and fail if custody is incomplete
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const result=await github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:context.runId,per_page:100});
            const jobs=result.data.jobs.filter(x=>x.name&&x.name.startsWith('source-test ('));
            let artifacts=[];
            for(let attempt=0;attempt<5;attempt++){
              const result=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:context.runId,per_page:100});
              artifacts=result.data.artifacts.filter(x=>x.name&&x.name.startsWith('leeway-source-evidence-'));
              if(artifacts.length>=3)break;
              await new Promise(resolve=>setTimeout(resolve,1500));
            }
            const jobsPassed=jobs.length===3&&jobs.every(x=>x.conclusion==='success');
            const artifactsPresent=artifacts.length===3&&artifacts.every(x=>x.size_in_bytes>0&&!x.expired);
            const classification=jobsPassed&&artifactsPresent?'SOURCE_EVIDENCE_ARTIFACT_INDEXED':'SOURCE_EVIDENCE_CUSTODY_INCOMPLETE';
            const runUrl='https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const lines=[
              'Original run: '+runUrl,
              'Source commit: '+context.sha,
              'Runner jobs: '+jobs.length+'; successful: '+jobs.filter(x=>x.conclusion==='success').length,
              'Evidence artifacts: '+artifacts.length+' (expected 3)',
              'Original artifact bytes have NOT been independently read back; Receipt and Veritas remain unqualified.'
            ];
            await core.summary.addHeading('LeeWay source evidence: '+classification)
              .addRaw(lines.join('\n\n')).write();
            if(!jobsPassed||!artifactsPresent)core.setFailed(classification);
